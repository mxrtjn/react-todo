name: CI - E2E Tests

on:
  push:
jobs:
  cypress-run:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
      - name: "Setup Node.js"
        uses: "actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af"
        with:
          node-version: 18
      - name: "Install dependencies"
        run: npm install
      - name: "Run Cypress tests"
        run: npx cypress run --spec "cypress/e2e/1-getting-started"
      - name: "Parse Test Results and Send to Slack"
        if: always()
        env:
          AUTH_KEY_SLACK: ${{ secrets.AUTH_KEY_SLACK }}
        run: |
          report="results.json"
          total=$(jq '.totals.tests' $report)
          failed=$(jq '.totals.failed' $report)
          passed=$(jq '.totals.passed' $report)
          pending=$(jq '.totals.pending' $report)
          skipped=$(jq '.totals.skipped' $report)
          branch_name=$(echo "${GITHUB_REF#refs/heads/}")
          msg="📊 E2E Results on branch: $branch_name\n\n• Total: $total\n• Passed: $passed\n• Failed: $failed\n• Pending: $pending\n•Skipped: $skipped"
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"channel\":\"notificaciones-remuneraciones-peru\",\"text\":\"$msg\"}" \
            https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $AUTH_KEY_SLACK"
      - name: "Upload mochawesome report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report
          path: cypress/reports
